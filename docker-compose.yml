# Start:  cp .env.example .env  →  fill in .env  →  docker compose up -d  →  http://localhost:8050
services:
  map:
    build: .
    container_name: satisfactory-map
    ports:
      - "8050:8050"
    env_file: .env
    volumes:
      - map-data:/data                       # history, notes, last fetched save
      # If the game server runs on the same machine: mount the save folder directly and set SAVE_SOURCE=/saves in .env
      # - /path/to/FactoryGame/Saved/SaveGames/server:/saves:ro
    restart: unless-stopped

volumes:
  map-data:
